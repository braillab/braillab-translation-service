name: Validate language data

on:
  push:
    branches: [ main ]
    paths:
      - 'tests/**'
      - '**.json'
  pull_request:
    paths:
      - 'tests/**'
      - '**.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.5'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - run: |
          status=0
          for file in languages/*.json; do
            name=$(basename "$file" .json)
            [[ "$name" == _* ]] && continue   # skip _template.json
            echo "Testing $name"
            jq empty "$file" && pytest --data_name="$name" || status=1
          done
          exit $status